name: Release Claude Bridge
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: claude-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run typecheck && npm test && npm run build
      - name: Package and smoke test
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: npm run package:release -- "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-bridge-${{ matrix.platform }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release/*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release
          pattern: claude-bridge-*
          merge-multiple: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.1
      - name: Sign and independently verify manifest
        env:
          BRIDGE_MANIFEST_SIGNING_KEY: ${{ secrets.BRIDGE_MANIFEST_SIGNING_KEY }}
        run: |
          node scripts/create-release-manifest.mjs release "${GITHUB_REF_NAME#v}"
          node scripts/verify-release.mjs release release/manifest-bundle release-public-keys.json "${GITHUB_REF_NAME#v}"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release/manifest-bundle/manifest.json
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat release/*.sha256 > release/checksums.txt
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.sha256 release/checksums.txt release/manifest-bundle/manifest.json release/manifest-bundle/manifest.sig.json --draft --verify-tag --title "Claude Bridge $version" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
